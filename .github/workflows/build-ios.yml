name: Build iOS IPA

on:
  push:
    branches:
      - human-v2
  workflow_dispatch:
    inputs:
      tenant:
        description: 'Select tenant/flavor to build'
        required: true
        default: 'domex'
        type: choice
        options:
          - domex
          - digitable
          - mahajana
      export_method:
        description: 'IPA Export Method'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - ad-hoc
          - app-store

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Define path variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # 1. Decode base64 strings into files
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH

          # 2. Create a temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 3. Import certificate to keychain
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 4. Copy provisioning profile to the library directory
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Determine Tenant and Target
        id: config
        run: |
          # Default configurations
          TENANT="domex"
          TARGET="lib/main_domex.dart"
          EXPORT_METHOD="development"
          
          # If triggered manually, use the inputs
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TENANT="${{ github.event.inputs.tenant }}"
            EXPORT_METHOD="${{ github.event.inputs.export_method }}"
          else
            # Default for push event
            TENANT="domex"
            EXPORT_METHOD="development"
          fi
          
          TARGET="lib/main_${TENANT}.dart"
          
          echo "tenant=$TENANT" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "export_method=$EXPORT_METHOD" >> $GITHUB_OUTPUT

      - name: Prepare Tenant iOS Assets and Config
        run: |
          chmod +x tooling/prepare_ios_flavor.sh
          ./tooling/prepare_ios_flavor.sh ${{ steps.config.outputs.tenant }}

      - name: Install Dependencies
        run: |
          flutter pub get

      - name: Build CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build IPA
        run: |
          flutter build ipa --release \
            -t ${{ steps.config.outputs.target }} \
            --dart-define=tenant=${{ steps.config.outputs.tenant }} \
            --export-method=${{ steps.config.outputs.export_method }} \
            --build-number=${{ github.run_number }}

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ steps.config.outputs.tenant }}-${{ steps.config.outputs.export_method }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
