plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"   
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file('key.properties')
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withReader('UTF-8') { reader ->
        keyProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "asia.ceynet.human.pocket"

    signingConfigs {
        release {
            keyAlias keyProperties['keyAlias']
            keyPassword keyProperties['keyPassword']
            storeFile keyProperties['storeFile'] ? file(keyProperties['storeFile']) : null
            storePassword keyProperties['storePassword']
        }
    }
    // compileSdk flutter.compileSdkVersion
    
    compileSdk 36
    ndkVersion "27.0.12077973"
    buildToolsVersion "33.0.3"
    
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

   kotlinOptions {
       jvmTarget = '17' // Match Kotlin plugin version
   }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "asia.ceynet.human.pocket"
        minSdkVersion 24 //flutter.minSdkVersion
       // targetSdkVersion flutter.targetSdkVersion
          targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    flavorDimensions "tenant"
    productFlavors {
        digitable {
            dimension "tenant"
            applicationId "asia.ceynet.human.pocket"
            resValue "string", "app_name", "Pocket HR"
        }
        domex {
            dimension "tenant"
            applicationId "io.digitable.go.domex.human"
            resValue "string", "app_name", "My Domex"
        }
        mahajana {
            dimension "tenant"
            applicationId "com.mahajana.human.pocket"
            resValue "string", "app_name", "Mahajana HR"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies { 
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    // implementation "org.jetbrains.kotlin:kotlin-reflect:1.7.20" 
    // implementation 'androidx.multidex:multidex:2.0.0'
    // implementation platform('com.google.firebase:firebase-bom:32.2.2')
    // implementation 'com.google.firebase:firebase-analytics-ktx'
}
