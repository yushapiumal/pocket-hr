name: cn_pocket_hr
description: "A new Flutter project."
publish_to: 'none'
version: 1.2.2+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  cached_network_image: ^3.3.1
  carousel_slider: ^5.0.0
  connectivity_plus: 7.0.0
  dotted_line: ^3.2.2
  expandable: ^5.0.1
  flutter:
    sdk: flutter
  flutter_blurhash: ^0.9.1
  flutter_launcher_icons: ^0.14.4
  flutter_slidable: ^4.0.3
  flutter_svg: ^2.0.9
  fluttertoast: ^9.0.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  get: ^4.6.6
  intl: any
  localstorage: ^4.0.0
  shared_preferences: ^2.5.3
  meta: ^1.11.0
  provider: ^6.1.1
  flutter_localization: ^0.3.3
  syncfusion_flutter_calendar: ^31.1.19
  win32: ^5.5.0
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.2
  app_links: ^6.4.1
  path_provider: ^2.1.2
  battery_plus: ^7.0.0
  network_info_plus: ^7.0.0
  device_info_plus: 12.3.0
  mobile_scanner: ^7.2.0
  package_info_plus: ^9.0.0
  auto_size_text: ^3.0.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.0
  vibration: ^3.1.8
  flutter_web_auth_2: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0
  # flutter_permission_scanner: ^1.0.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/
    - assets/sounds/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/font/Poppins-Regular.ttf
        - asset: assets/font/Poppins-Bold.ttf
          weight: 700
        - asset: assets/font/Poppins-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/font/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/font/Poppins-ExtraBoldItalic.ttf
          style: italic
          weight: 800
        - asset: assets/font/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/font/Poppins-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/font/Poppins-Italic.ttf
          style: italic
        - asset: assets/font/Poppins-Light.ttf
          weight: 300
        - asset: assets/font/Poppins-LightItalic.ttf
          style: italic
          weight: 300
        - asset: assets/font/Poppins-Medium.ttf
          weight: 500
        - asset: assets/font/Poppins-MediumItalic.ttf
          weight: 500
          style: italic

flutter_native_splash:
  color: "#ffcc09"
  image: assets/images/bg_remove_domex_app_logo.png

  android: true
  ios: true

  fullscreen: true

  android_12:
    color: "#ffcc09"
    image: assets/images/bg_remove_domex_app_logo.png 
    